# swarm.yaml — 一个文件描述整个系统行为
# 被 packages/shared/config.py 读取

version: 1

defaults:
  model: worker
  max_subagents: 5          # asyncio.Semaphore 上限
  step_budget: 50
  orchestrator_step_budget: 15
  context_compaction_threshold: 0.6

roles:
  pm:
    model: worker
    system_prompt: "你是项目经理，负责拆解任务、协调进度、确保交付质量。"
  designer:
    model: worker
    system_prompt: "你是 UI 设计师，负责界面设计和用户体验。"
  frontend:
    model: worker
    system_prompt: "你是前端工程师，负责用 React/TypeScript 实现界面。"
  backend:
    model: worker
    system_prompt: "你是后端工程师，负责 API 设计和数据逻辑。"
  tester:
    model: worker
    system_prompt: "你是测试工程师，负责验证功能正确性和边界情况。"
  ops:
    model: worker
    system_prompt: "你是运维工程师，负责部署、监控和稳定性。"

tools:
  enabled: [bash, file_read, file_write, file_edit, file_grep, file_glob, web_search, todo_create, todo_update]
  disabled: []

budget:
  daily_max_usd: 3.0
  per_task_max_usd: 0.5

models:
  orchestrator: worker
  worker_default: worker
