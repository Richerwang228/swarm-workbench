[project]
name = "swarm-workbench"
version = "0.2.0b2"
description = "A local-first multi-agent orchestration workbench and reference implementation."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [
    { name = "WANG Ze Xiang Richer" },
]
dependencies = [
    # Web framework
    "fastapi>=0.140.2",
    "uvicorn[standard]>=0.34.0",
    "sse-starlette>=2.0.0",
    "websockets>=14.0",
    # LangGraph orchestration
    "langgraph>=0.4.0",
    # LLM gateway
    "litellm>=1.60.0",
    # Data & validation
    "pydantic>=2.10.0",
    "python-dotenv>=1.0.0",
    # Utilities
    "httpx>=0.28.0",
    "shortuuid>=1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
warn_unused_ignores = true
exclude = ["apps/web", "data"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apps", "packages"]
